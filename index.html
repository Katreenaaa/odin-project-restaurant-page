<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vine & Verde</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  <script defer src="main.js"></script></head>
  <body>
    <header class="navbar">
      <div class="nav-container">
        <div class="brand">
          <svg
            class="logo"
            viewBox="0 0 100 100"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle
              cx="50"
              cy="50"
              r="45"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="M30 40C30 35 35 30 50 30C65 30 70 35 70 40C70 45 65 50 50 50C35 50 30 45 30 40Z"
              fill="currentColor"
            />
            <path
              d="M35 60C35 55 40 50 50 50C60 50 65 55 65 60C65 65 60 70 50 70C40 70 35 65 35 60Z"
              fill="currentColor"
            />
          </svg>
          <span class="brand-name">Verde & Vino</span>
        </div>

        <nav>
          <button class="nav-btn" id="homeBtn">Home</button>
          <button class="nav-btn" id="menuBtn">Menu</button>
          <button class="nav-btn" id="contactBtn">Contact</button>
        </nav>
      </div>
    </header>

    <div id="content"></div>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div class="footer-block">
          <h4>Visit Us</h4>
          <p>Lagos, Nigeria</p>
          <p>+234 123 456 789</p>
          <p>vineandverde@email.com</p>
        </div>
        <div class="footer-block">
          <h4>Opening Hours</h4>
          <p>
            Mon - Thu: 11:00 AM - 10:00 PM<br />Fri - Sat: 11:00 AM - 11:00
            PM<br />Sun: 12:00 PM - 9:00 PM
          </p>
        </div>
        <div class="footer-block">
          <h4>Connect</h4>
          <div class="social-links">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Verde & Vino. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
